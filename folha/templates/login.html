<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
    <h2>Login SaaS Folha</h2>
    {% if messages %}
        <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <label>E-mail:</label><input type="email" name="email" maxlength="254" required><br>
        <label>Senha:</label><input type="password" name="senha" maxlength="128" required><br>
        <button type="submit">Entrar</button>
    </form>
    <p>Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</body>
</html>
